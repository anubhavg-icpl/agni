name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build static binary
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -tags gui -o agni .
          ./agni --version || true

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build packages
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp agni dist/agni-linux-amd64
          nfpm package -f packaging/nfpm.yaml -p deb -t "dist/agni_${VERSION}_amd64.deb"
          nfpm package -f packaging/nfpm.yaml -p rpm -t "dist/agni_${VERSION}_x86_64.rpm"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/agni-linux-amd64
            dist/agni_${{ github.ref_name }}_amd64.deb
            dist/agni_${{ github.ref_name }}_x86_64.rpm
